<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021422" stop-opacity="1" />
      <stop offset="70%" stop-color="#00070c" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#a5f3fc" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient Cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="photonicBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseCore" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="sharp" />
      <feGaussianBlur stdDeviation="12" result="soft" />
      <feMerge>
        <feMergeNode in="soft" />
        <feMergeNode in="sharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Void Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />

  <!-- Outer HUD Ring & Ticks -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1.5" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />

  <!-- 14 Harmonic Caustic Lobes Reference Ring -->
  <g filter="url(#photonicBloom)" opacity="0.85">
    <circle cx="256" cy="256" r="172" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="14 18" />
    <circle cx="256" cy="256" r="148" fill="none" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1.5" />
  </g>

  <!-- Arc Reactor Coil Segments (10 Segment Ring) -->
  <g transform="translate(256, 256)" filter="url(#photonicBloom)">
    <!-- 10 Reactor Toroid Blocks -->
    <g stroke="#00e5ff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M 0,-128 A 128 128 0 0 1 75,-103" />
      <path d="M 103,-75 A 128 128 0 0 1 128,0" />
      <path d="M 128,0 A 128 128 0 0 1 103,75" />
      <path d="M 75,103 A 128 128 0 0 1 0,128" />
      <path d="M 0,128 A 128 128 0 0 1 -75,103" />
      <path d="M -103,75 A 128 128 0 0 1 -128,0" />
      <path d="M -128,0 A 128 128 0 0 1 -103,-75" />
      <path d="M -75,-103 A 128 128 0 0 1 0,-128" />
    </g>

    <!-- Toroid Secondary Inner Ring -->
    <circle r="96" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.75" />
    <circle r="86" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />

    <!-- Radiant Diffraction Cross Rays -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#a5f3fc" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#a5f3fc" stroke-width="1.5" opacity="0.4" />
    <line x1="-115" y1="-115" x2="115" y2="115" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
    <line x1="-115" y1="115" x2="115" y2="-115" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

    <!-- Inner Triangular Reactor Core Matrix -->
    <polygon points="0,-64 55,32 -55,32" fill="none" stroke="#00e5ff" stroke-width="3.5" opacity="0.8" />
    <polygon points="0,64 -55,-32 55,-32" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

    <!-- Center Singularity Core -->
    <circle r="52" fill="url(#coreGlow)" filter="url(#intenseCore)" />
    <circle r="22" fill="#ffffff" filter="url(#photonicBloom)" />
    <circle r="8" fill="#ffffff" />
  </g>
</svg>
